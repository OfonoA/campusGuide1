<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Header Preview</title>
  <style>
    :root{
      --bg-gradient-start:#eef2ff;
      --bg-gradient-end:#ffffff;
      --accent:#0f172a;
      --muted:#64748b;
      --card-bg: rgba(255,255,255,0.85);
      --glass: rgba(255,255,255,0.6);
      --accent-2: #f59e0b;
    }
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
    .viewport{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 24px;background:linear-gradient(180deg,var(--bg-gradient-start),var(--bg-gradient-end));}
    .header-wrap{width:1100px;max-width:96%;border-radius:14px;padding:28px;background:linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6));box-shadow:0 10px 30px rgba(15,23,42,0.08);backdrop-filter: blur(8px);}
    .label{display:inline-block;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,#fff7ed,#ffedd5);color:#92400e;font-weight:600;font-size:12px;letter-spacing:0.06em}
    h1{margin:12px 0 8px;font-size:40px;line-height:1.02;color:var(--accent);font-weight:800}
    p.lead{margin:0;color:var(--muted);max-width:70%;font-size:14px}
    .metrics{display:flex;gap:10px;margin-top:18px}
    .metric{background:var(--card-bg);border-radius:10px;padding:10px 14px;min-width:120px;display:flex;flex-direction:column;align-items:flex-end;box-shadow:0 4px 18px rgba(12,18,32,0.04)}
    .metric .k{font-size:11px;color:var(--muted);font-weight:600}
    .metric .v{font-size:20px;font-weight:800;color:var(--accent)}
    .metric.important .v{color:var(--accent-2)}

    /* smaller screen tweaks */
    @media (max-width:720px){
      .header-wrap{padding:20px}
      h1{font-size:28px}
      .metrics{flex-wrap:wrap}
      .metric{min-width:90px}
      p.lead{max-width:100%}
    }

    /* decorative left accent */
    .header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .left-col{flex:1}
    .right-col{display:flex;gap:10px;align-items:center}

    /* subtle hero background */
    .hero-decor{position:relative}
    .hero-decor::after{content:"";position:absolute;right:-40px;top:-30px;width:260px;height:120px;background:radial-gradient(closest-side, rgba(99,102,241,0.12), transparent 60%);border-radius:20px;z-index:0}
    .header-content{position:relative;z-index:1}
  </style>
</head>
<body>
  <div class="viewport">
    <div class="header-wrap">
      <div class="header-row">
        <div class="left-col header-content">
          <div class="label">ADMINISTRATION</div>
          <h1>Admin Operations</h1>
          <p class="lead">Ticket assignment and support oversight</p>
          <div class="metrics">
            <div class="metric">
              <div class="k">Open tickets</div>
              <div class="v">23</div>
            </div>
            <div class="metric">
              <div class="k">Assigned</div>
              <div class="v">0</div>
            </div>
            <div class="metric important">
              <div class="k">In progress</div>
              <div class="v">4</div>
            </div>
            <div class="metric">
              <div class="k">Resolved today</div>
              <div class="v">4</div>
            </div>
          </div>
        </div>
        <div class="right-col header-content">
          <button style="background:#0f172a;color:white;padding:10px 14px;border-radius:8px;border:none;font-weight:700;box-shadow:0 6px 18px rgba(15,23,42,0.12)">New Ticket</button>
        </div>
      </div>
      <div class="hero-decor" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
